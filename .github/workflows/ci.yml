name: CI

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: task_lane_test
          POSTGRES_USER: task_lane
          POSTGRES_PASSWORD: task_lane_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U task_lane -d task_lane_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://task_lane:task_lane_test@127.0.0.1:5432/task_lane_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'

      - name: Install pnpm
        run: npm install --global pnpm@12.4.1

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Unit tests
        run: pnpm test

      - name: PostgreSQL integration tests
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: pnpm test:integration

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Prepare persistent host directories
        run: |
          mkdir -p "$HOME/.task-lane/repos/readonly-smoke/.git" "$HOME/.task-lane/plans" "$HOME/.task-lane/logs"
          printf 'source-is-immutable\n' > "$HOME/.task-lane/repos/readonly-smoke/source.txt"
          printf ref > "$HOME/.task-lane/repos/readonly-smoke/.git/HEAD"

      - name: Start Docker Compose stack
        run: docker compose up -d --build

      - name: Verify web and database health
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/api/health; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs web worker postgres
          exit 1

      - name: Verify services are healthy
        run: docker compose ps

      - name: Verify planning checkout is read-only but runtime remains usable
        run: |
          docker compose exec -T worker sh -c 'mkdir -p /data/repos/management-smoke/.git && printf management-write > /data/repos/management-smoke/source.txt && printf ref > /data/repos/management-smoke/.git/HEAD'
          test "$(docker compose exec -T worker sh -c 'cat /data/repos/management-smoke/source.txt')" = management-write
          test "$(docker compose exec -T worker sh -c 'cat /data/agent-repos/readonly-smoke/source.txt')" = source-is-immutable
          if docker compose exec -T worker sh -c 'printf mutated > /data/agent-repos/readonly-smoke/source.txt'; then
            echo 'planning checkout unexpectedly accepted a source mutation'
            exit 1
          fi
          if docker compose exec -T worker sh -c 'touch /data/agent-repos/readonly-smoke/new-source.txt'; then exit 1; fi
          if docker compose exec -T worker sh -c 'rm /data/agent-repos/readonly-smoke/source.txt'; then exit 1; fi
          if docker compose exec -T worker sh -c 'printf mutated > /data/agent-repos/readonly-smoke/.git/HEAD'; then exit 1; fi
          test "$(cat "$HOME/.task-lane/repos/readonly-smoke/source.txt")" = source-is-immutable
          docker compose exec -T worker sh -c 'test "$(cat /data/agent-repos/readonly-smoke/source.txt)" = source-is-immutable && node -e "const fs = require(\"node:fs\"); fs.mkdirSync(\"/data/plans/readonly-smoke\", { recursive: true }); fs.writeFileSync(\"/tmp/task-lane-scratch.txt\", \"scratch\"); fs.writeFileSync(\"/data/plans/readonly-smoke/handoff.json\", \"{}\"); require(\"node:child_process\").execFileSync(process.execPath, [\"-e\", \"process.stdout.write(\\\"child-ok\\\")\"]); fetch(\"http://web:3000/api/health\").then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))" && test -s /tmp/task-lane-scratch.txt && test -s /data/plans/readonly-smoke/handoff.json'

      - name: Stop Docker Compose stack
        if: always()
        run: docker compose down
