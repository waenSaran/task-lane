name: CI

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: task_lane_test
          POSTGRES_USER: task_lane
          POSTGRES_PASSWORD: task_lane_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U task_lane -d task_lane_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://task_lane:task_lane_test@127.0.0.1:5432/task_lane_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'

      - name: Install pnpm
        run: npm install --global pnpm@12.4.1

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Unit tests
        run: pnpm test

      - name: PostgreSQL integration tests
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: pnpm test:integration

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Prepare persistent host directories
        run: mkdir -p "$HOME/.task-lane/repos" "$HOME/.task-lane/plans" "$HOME/.task-lane/logs"

      - name: Start Docker Compose stack
        run: docker compose up -d --build

      - name: Verify web and database health
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/api/health; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs web worker postgres
          exit 1

      - name: Verify services are healthy
        run: docker compose ps

      - name: Stop Docker Compose stack
        if: always()
        run: docker compose down
